# Linked card, default target
- type: custom-api
  title: Figure — linked / default target
  frameless: true
  options:
    src: https://placehold.co/600x400
    alt: Linked Figure Card
    url: https://example.com/default-target
    frameless: false
    padding: true
    caption: The entire internal Figure Card links to a new tab.
  template: *figure-card-template

# Linked card, same tab; caption provides the accessible name
- type: custom-api
  title: Figure — linked / same tab
  frameless: true
  options:
    src: https://placehold.co/600x400
    alt: ""
    url: https://example.com/same-tab
    same-tab: true
    frameless: true
    padding: false
    caption: This caption labels a same-tab Figure Card link.
  template: *figure-card-template

# Explicit target overrides same-tab; URL provides the accessible-name fallback
- type: custom-api
  title: Figure — linked / explicit target
  frameless: true
  options:
    src: https://placehold.co/600x400
    alt: ""
    url: https://example.com/explicit-target
    same-tab: true
    target: _blank
    frameless: false
    padding: false
    caption: ~
  template: *figure-card-template

